# Target application for the lab: OWASP Juice Shop behind an Nginx reverse proxy.
# Nginx writes every request to ./nginx-logs/access.log, which the Wazuh agent reads.
# Wazuh itself runs from the official wazuh-docker single-node setup (see docs/setup.md).

services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    expose:
      - "3000"

  nginx-proxy:
    image: nginx:stable
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      - juice-shop
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-logs:/var/log/nginx
