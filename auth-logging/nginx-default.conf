# Nginx config used in the lab (reverse proxy in front of Juice Shop).
# Changes for the auth event:
#  1. combined_rid: the standard "combined" format + rid=$request_id at the end (correlation ID)
#  2. /rest/user/login is routed through auth_logger.py, which forwards it to Juice Shop
#  3. X-Request-ID is passed on so the auth event gets the same correlation ID

log_format combined_rid '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" rid=$request_id';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log combined_rid;
    error_log /var/log/nginx/error.log warn;

    # Login requests go through the auth logger first
    location = /rest/user/login {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://offer-juice-shop:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
